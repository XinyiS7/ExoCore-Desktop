<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Warm parchment gradient -->
    <linearGradient id="quill-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4A97D"/>
      <stop offset="40%" stop-color="#E8DCC8"/>
      <stop offset="100%" stop-color="#FAF6F0"/>
    </linearGradient>
    <!-- Ink gradient -->
    <linearGradient id="ink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2B1F"/>
      <stop offset="100%" stop-color="#6B4C3B"/>
    </linearGradient>
    <!-- Feather highlight -->
    <linearGradient id="feather-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFEFB"/>
      <stop offset="100%" stop-color="#E8DCC8" stop-opacity="0"/>
    </linearGradient>
    <filter id="ink-shadow">
      <feDropShadow dx="0.3" dy="0.5" stdDeviation="0.5" flood-color="#3D2B1F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Transparent bg for clean favicon display -->
  <rect width="48" height="48" fill="#FAF6F0" rx="6"/>

  <!-- Quill shaft -->
  <line x1="30" y1="6" x2="14" y2="42" stroke="#C4A97D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Quill feather body - left barbs -->
  <path d="M 30,6
           C 24,10  22,14  20,18
           C 19,20  18,22  17,24
           C 16,26  15,28  14,30"
        fill="url(#quill-grad)" stroke="#C4A97D" stroke-width="0.5" opacity="0.9"/>

  <!-- Quill feather body - right barbs (slightly narrower, elegant asymmetry) -->
  <path d="M 30,6
           C 32,10  31,14  29,18
           C 28,20  27,22  25,24
           C 23,26  21,28  19,30"
        fill="url(#feather-shine)" stroke="#C4A97D" stroke-width="0.5" opacity="0.85"/>

  <!-- Feather barb detail lines - left -->
  <line x1="26" y1="10" x2="22" y2="17" stroke="#C4A97D" stroke-width="0.4" opacity="0.5"/>
  <line x1="24" y1="13" x2="20" y2="20" stroke="#C4A97D" stroke-width="0.4" opacity="0.5"/>
  <line x1="22" y1="16" x2="18" y2="23" stroke="#C4A97D" stroke-width="0.4" opacity="0.5"/>
  <line x1="20" y1="20" x2="17" y2="25" stroke="#C4A97D" stroke-width="0.4" opacity="0.4"/>

  <!-- Feather barb detail lines - right -->
  <line x1="28" y1="10" x2="31" y2="16" stroke="#B8A080" stroke-width="0.4" opacity="0.4"/>
  <line x1="27" y1="14" x2="29" y2="20" stroke="#B8A080" stroke-width="0.4" opacity="0.4"/>
  <line x1="25" y1="18" x2="27" y2="23" stroke="#B8A080" stroke-width="0.4" opacity="0.3"/>

  <!-- Quill nib (metal nib tip) -->
  <path d="M 14,42 L 12,45 L 16,45 Z" fill="url(#ink-grad)" filter="url(#ink-shadow)"/>
  <line x1="14" y1="42" x2="14" y2="44.5" stroke="#1A1208" stroke-width="0.6"/>

  <!-- Small ink drop accent -->
  <circle cx="17" cy="43" r="1.2" fill="#3D2B1F" opacity="0.7"/>
</svg>
