<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Crimson core glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2E2E" stop-opacity="1"/>
      <stop offset="30%" stop-color="#B30F0F" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#540303" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0C0D12" stop-opacity="0"/>
    </radialGradient>
    <!-- Iron ring gradient -->
    <linearGradient id="iron-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C6370"/>
      <stop offset="50%" stop-color="#21252B"/>
      <stop offset="100%" stop-color="#12141A"/>
    </linearGradient>
    <!-- Crimson trace -->
    <linearGradient id="crimson-trace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#5E0000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient bg -->
  <rect width="48" height="48" fill="#0C0D12" rx="6"/>

  <!-- Background core ambient glow -->
  <circle cx="24" cy="24" r="18" fill="url(#core-glow)" opacity="0.3" filter="url(#soft-glow)"/>

  <!-- Outer hexagonal shell (Alessandro perimeter) -->
  <polygon points="24,5 40.5,14.5 40.5,33.5 24,43 7.5,33.5 7.5,14.5"
           fill="none" stroke="url(#iron-ring)" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Inner nested hexagon (sandbox boundary) -->
  <polygon points="24,11 36,18 36,30 24,37 12,30 12,18"
           fill="none" stroke="#5C6370" stroke-width="0.7" stroke-opacity="0.35"/>

  <!-- Mathematical spiral (golden spiral approximation) -->
  <!-- Segment 1: top-right quadrant, small -->
  <path d="M 27,21 A 5,5 0 0,1 24,16"
        fill="none" stroke="url(#crimson-trace)" stroke-width="1" filter="url(#glow)"/>
  <!-- Segment 2: top-left quadrant -->
  <path d="M 24,16 A 8,8 0 0,1 20,20"
        fill="none" stroke="#FF3B30" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.8"/>
  <!-- Segment 3: bottom-left quadrant -->
  <path d="M 20,20 A 12,12 0 0,1 24,29"
        fill="none" stroke="#FF3B30" stroke-width="0.6" stroke-dasharray="2,3" opacity="0.6"/>
  <!-- Segment 4: bottom-right quadrant -->
  <path d="M 24,29 A 16,16 0 0,1 30,19"
        fill="none" stroke="#FF3B30" stroke-width="0.4" stroke-dasharray="1,4" opacity="0.35"/>

  <!-- Structural struts: hexagon center to inner vertices -->
  <line x1="24" y1="24" x2="24" y2="11" stroke="#5C6370" stroke-width="0.5" opacity="0.25"/>
  <line x1="24" y1="24" x2="36" y2="18" stroke="#5C6370" stroke-width="0.5" opacity="0.25"/>
  <line x1="24" y1="24" x2="36" y2="30" stroke="#5C6370" stroke-width="0.5" opacity="0.25"/>
  <line x1="24" y1="24" x2="24" y2="37" stroke="#5C6370" stroke-width="0.5" opacity="0.25"/>
  <line x1="24" y1="24" x2="12" y2="30" stroke="#5C6370" stroke-width="0.5" opacity="0.25"/>
  <line x1="24" y1="24" x2="12" y2="18" stroke="#5C6370" stroke-width="0.5" opacity="0.25"/>

  <!-- Central sovereign core -->
  <circle cx="24" cy="24" r="7" fill="url(#core-glow)" filter="url(#glow)"/>
  <circle cx="24" cy="24" r="3.5" fill="#12131A" stroke="#FF2E2E" stroke-width="0.8"/>

  <!-- Core geometry: rotated square anchor -->
  <rect x="21.5" y="21.5" width="5" height="5" fill="none" stroke="#FF3B30" stroke-width="0.8" transform="rotate(45 24 24)"/>

  <!-- Precision crosshairs -->
  <line x1="24" y1="14.5" x2="24" y2="16.5" stroke="#FF2E2E" stroke-width="0.8" opacity="0.8"/>
  <line x1="24" y1="31.5" x2="24" y2="33.5" stroke="#FF2E2E" stroke-width="0.8" opacity="0.8"/>
  <line x1="14.5" y1="24" x2="16.5" y2="24" stroke="#FF3B30" stroke-width="0.8" opacity="0.8"/>
  <line x1="31.5" y1="24" x2="33.5" y2="24" stroke="#FF3B30" stroke-width="0.8" opacity="0.8"/>
</svg>
