<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Crimson core glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2E2E" stop-opacity="1"/>
      <stop offset="25%" stop-color="#B30F0F" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#540303" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <!-- Iron ring gradient -->
    <linearGradient id="ironRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C6370"/>
      <stop offset="50%" stop-color="#21252B"/>
      <stop offset="100%" stop-color="#12141A"/>
    </linearGradient>
    <!-- Crimson trace -->
    <linearGradient id="crimsonTrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#5E0000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient bg -->
  <rect width="64" height="64" fill="#050505" rx="8"/>

  <!-- Background core ambient glow -->
  <circle cx="32" cy="32" r="24" fill="url(#coreGlow)" opacity="0.3" filter="url(#softGlow)"/>

  <!-- Outer hexagonal shell (Alessandro perimeter) -->
  <polygon points="46.5,7 61,32 46.5,57 17.5,57 3,32 17.5,7"
           fill="none" stroke="url(#ironRing)" stroke-width="1.8" stroke-opacity="0.8"/>

  <!-- Inner nested hexagon (sandbox boundary) -->
  <polygon points="32,14 50,25 50,39 32,50 14,39 14,25"
           fill="none" stroke="#5C6370" stroke-width="0.7" stroke-opacity="0.35"/>

  <!-- Structural struts: hexagon center to inner vertices -->
  <line x1="32" y1="32" x2="32" y2="14" stroke="#5C6370" stroke-width="0.5" opacity="0.2"/>
  <line x1="32" y1="32" x2="50" y2="25" stroke="#5C6370" stroke-width="0.5" opacity="0.2"/>
  <line x1="32" y1="32" x2="50" y2="39" stroke="#5C6370" stroke-width="0.5" opacity="0.2"/>
  <line x1="32" y1="32" x2="32" y2="50" stroke="#5C6370" stroke-width="0.5" opacity="0.2"/>
  <line x1="32" y1="32" x2="14" y2="39" stroke="#5C6370" stroke-width="0.5" opacity="0.2"/>
  <line x1="32" y1="32" x2="14" y2="25" stroke="#5C6370" stroke-width="0.5" opacity="0.2"/>

  <!-- Central sovereign core glow -->
  <circle cx="32" cy="32" r="22" fill="url(#coreGlow)" filter="url(#glow)"/>

  <!-- Floating EXO geometry (octagon + diamond) -->
  <g transform="translate(32 32) scale(0.7) translate(-32 -32)" filter="url(#glow)">
    <!-- Octagon outer ring -->
    <path d="M32 4 L42 22 L60 32 L42 42 L32 60 L22 42 L4 32 L22 22 Z"
          fill="none" stroke="#FF3B30" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
    <!-- Inner diamond -->
    <path d="M32 16 L38 32 L32 48 L26 32 Z" fill="#FF2E2E" opacity="0.7"/>
  </g>

  <!-- Central precise core -->
  <circle cx="32" cy="32" r="3" fill="#0C0D12" stroke="#FF2E2E" stroke-width="0.8" filter="url(#glow)"/>

  <!-- Precision crosshairs -->
  <line x1="32" y1="20" x2="32" y2="22.5" stroke="#FF2E2E" stroke-width="0.8" opacity="0.8"/>
  <line x1="32" y1="41.5" x2="32" y2="44" stroke="#FF2E2E" stroke-width="0.8" opacity="0.8"/>
  <line x1="20" y1="32" x2="22.5" y2="32" stroke="#FF3B30" stroke-width="0.8" opacity="0.8"/>
  <line x1="41.5" y1="32" x2="44" y2="32" stroke="#FF3B30" stroke-width="0.8" opacity="0.8"/>
</svg>
