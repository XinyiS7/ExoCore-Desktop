<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Vega primary glow -->
    <radialGradient id="vega-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0F4FF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#8CA8FF" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#3B5FC0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <!-- Star gradient -->
    <radialGradient id="star-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D0DCFF"/>
      <stop offset="100%" stop-color="#6B8ED4"/>
    </radialGradient>
    <!-- Constellation line gradient (top to bottom fade) -->
    <linearGradient id="const-line" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8CA8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B5FC0" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="star-glow">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="48" height="48" fill="#0D1117" rx="6"/>

  <!-- Vega ambient halo -->
  <circle cx="24" cy="9" r="14" fill="url(#vega-glow)" opacity="0.35"/>

  <!-- === Constellation lines === -->
  <!-- Vega to Beta (Sheliak) - top right -->
  <line x1="24" y1="9" x2="35" y2="20" stroke="url(#const-line)" stroke-width="0.7" opacity="0.75"/>
  <!-- Vega to Zeta - top left -->
  <line x1="24" y1="9" x2="13" y2="20" stroke="url(#const-line)" stroke-width="0.7" opacity="0.75"/>
  <!-- Zeta to Beta (top of parallelogram) -->
  <line x1="13" y1="20" x2="35" y2="20" stroke="#4B6EBF" stroke-width="0.5" opacity="0.4"/>
  <!-- Beta to Gamma (Sulafat) - right side -->
  <line x1="35" y1="20" x2="31" y2="32" stroke="url(#const-line)" stroke-width="0.7" opacity="0.7"/>
  <!-- Gamma to Delta - bottom -->
  <line x1="31" y1="32" x2="17" y2="35" stroke="url(#const-line)" stroke-width="0.7" opacity="0.6"/>
  <!-- Delta to Zeta - left side -->
  <line x1="17" y1="35" x2="13" y2="20" stroke="url(#const-line)" stroke-width="0.7" opacity="0.65"/>

  <!-- === Star nodes === -->
  <!-- Vega (α Lyrae) — brightest, largest -->
  <circle cx="24" cy="9" r="3" fill="#F0F4FF" filter="url(#star-glow)"/>
  <circle cx="24" cy="9" r="1.4" fill="#FFFFFF"/>
  <!-- Vega 4-point sparkle -->
  <line x1="24" y1="4" x2="24" y2="5.5" stroke="#FFFFFF" stroke-width="0.6" opacity="0.9"/>
  <line x1="24" y1="12.5" x2="24" y2="14" stroke="#FFFFFF" stroke-width="0.6" opacity="0.7"/>
  <line x1="19" y1="9" x2="20.5" y2="9" stroke="#FFFFFF" stroke-width="0.6" opacity="0.7"/>
  <line x1="27.5" y1="9" x2="29" y2="9" stroke="#FFFFFF" stroke-width="0.6" opacity="0.7"/>

  <!-- Beta Lyrae (Sheliak) — top-right of parallelogram -->
  <circle cx="35" cy="20" r="1.8" fill="url(#star-grad)" filter="url(#soft-glow)"/>
  <circle cx="35" cy="20" r="0.8" fill="#D0DCFF"/>

  <!-- Gamma Lyrae (Sulafat) — bottom-right -->
  <circle cx="31" cy="32" r="1.5" fill="url(#star-grad)" filter="url(#soft-glow)"/>
  <circle cx="31" cy="32" r="0.65" fill="#D0DCFF"/>

  <!-- Delta Lyrae — bottom-left -->
  <circle cx="17" cy="35" r="1.3" fill="url(#star-grad)" filter="url(#soft-glow)"/>
  <circle cx="17" cy="35" r="0.55" fill="#C5D5F8"/>

  <!-- Zeta Lyrae — top-left of parallelogram -->
  <circle cx="13" cy="20" r="1.6" fill="url(#star-grad)" filter="url(#soft-glow)"/>
  <circle cx="13" cy="20" r="0.7" fill="#D0DCFF"/>

  <!-- Faint lyre body arc connecting the parallelogram suggestively -->
  <path d="M 35,20 C 30,40 18,40 13,20"
        fill="none" stroke="#3B5FC0" stroke-width="0.35" stroke-dasharray="2,2.5" opacity="0.25"/>
</svg>
