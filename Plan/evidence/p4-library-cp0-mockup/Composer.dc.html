<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Composer 待发藏品卡</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0a0c}
</style>
</helmet>
<div style="width: 1200px; height: 720px; background: #0a0a0c; color: #e9e9ee; font-family: 'Sarasa Gothic Mono', 'LXGW WenKai', monospace; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
  <section style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 13px; color: #9a9aa6; font-weight: 500">A · 正常：3 张待发卡 + 1 个文件 + 草稿保留</h2>
    <div style="background: #101014; border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
      <div aria-label="待发藏品卡" style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
        <span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 10px; border-radius: 8px; background: #ece8df; color: #24221e; font-size: 13px"><span style="font-size: 11px; color: #6b665b">藏品 · 文字</span>夜里那句话<button type="button" aria-label="移除 夜里那句话" style="width: 28px; height: 28px; border: 0; background: transparent; color: #6b665b; font-size: 16px">×</button></span>
        <span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 10px; border-radius: 8px; background: #ece8df; color: #24221e; font-size: 13px"><span style="font-size: 11px; color: #6b665b">藏品 · 文档</span>记忆压缩那篇<button type="button" aria-label="移除 记忆压缩那篇" style="width: 28px; height: 28px; border: 0; background: transparent; color: #6b665b; font-size: 16px">×</button></span>
        <span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 10px; border-radius: 8px; background: #ece8df; color: #24221e; font-size: 13px"><span style="font-size: 11px; color: #6b665b">藏品 · 文字</span>藏品 #57<button type="button" aria-label="移除 藏品 #57" style="width: 28px; height: 28px; border: 0; background: transparent; color: #6b665b; font-size: 16px">×</button></span>
        <span style="font-size: 12px; color: #6d6d78; margin-left: 4px">3 / 5</span>
        <span style="width: 1px; height: 24px; background: rgba(255,255,255,0.16); margin: 0 4px"></span>
        <span style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 8px; background: #16161c; font-size: 13px; color: #cfcfd6">notes.md</span>
      </div>
      <label style="display: flex; align-items: flex-end; gap: 10px">
        <textarea aria-label="消息" rows="2" style="flex: 1; resize: none; background: transparent; border: 0; color: #e9e9ee; font: inherit; font-size: 15px; outline: none">这几件一起看看？</textarea>
        <button type="button" aria-label="发送" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #4f8cff; color: #fff; font-size: 18px">↑</button>
      </label>
    </div>
  </section>
  <section style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 13px; color: #9a9aa6; font-weight: 500">B · 发送被拒：按 item_id 标红，草稿、文件、其他卡都在</h2>
    <div style="background: #101014; border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
      <div role="alert" style="font-size: 13px; color: #ff8a8a">发送失败：“窗台上的猫”的原件不可用，移除后再发送。</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
        <span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 10px; border-radius: 8px; background: #ece8df; color: #24221e; font-size: 13px"><span style="font-size: 11px; color: #6b665b">藏品 · 文字</span>夜里那句话<button type="button" aria-label="移除 夜里那句话" style="width: 28px; height: 28px; border: 0; background: transparent; color: #6b665b; font-size: 16px">×</button></span>
        <span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 10px; border-radius: 8px; background: #3a1c1c; border: 1px solid #ff6b6b; color: #ffd0d0; font-size: 13px"><span style="font-size: 11px">原件不可用</span>窗台上的猫<button type="button" aria-label="移除 窗台上的猫" style="width: 28px; height: 28px; border: 0; background: transparent; color: #ffd0d0; font-size: 16px">×</button></span>
      </div>
      <label style="display: flex; align-items: flex-end; gap: 10px">
        <textarea aria-label="消息" rows="1" style="flex: 1; resize: none; background: transparent; border: 0; color: #e9e9ee; font: inherit; font-size: 15px; outline: none">还记得这个吗</textarea>
        <button type="button" aria-label="发送" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #4f8cff; color: #fff; font-size: 18px">↑</button>
      </label>
    </div>
  </section>
  <section style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 13px; color: #9a9aa6; font-weight: 500">C · 编辑消息时：卡片区置灰，不随编辑发送</h2>
    <div style="background: #101014; border: 1px solid #e8b64c; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 8px; align-items: center; opacity: 0.45">
        <span style="display: flex; align-items: center; height: 36px; padding: 0 10px; border-radius: 8px; background: #ece8df; color: #24221e; font-size: 13px">夜里那句话</span>
        <span style="display: flex; align-items: center; height: 36px; padding: 0 10px; border-radius: 8px; background: #ece8df; color: #24221e; font-size: 13px">记忆压缩那篇</span>
      </div>
      <span style="font-size: 12px; color: #e8b64c">编辑消息时不能带藏品</span>
      <label style="display: flex; align-items: flex-end; gap: 10px">
        <textarea aria-label="编辑消息" rows="1" style="flex: 1; resize: none; background: transparent; border: 0; color: #e9e9ee; font: inherit; font-size: 15px; outline: none">（正在编辑上一条消息）</textarea>
        <button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: #4f8cff; color: #fff; font: inherit; font-size: 14px">保存</button>
      </label>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
