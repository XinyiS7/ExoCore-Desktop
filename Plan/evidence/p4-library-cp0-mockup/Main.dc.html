<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Library 拍立得墙</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0a0c}
a{color:#4f8cff}a:hover{color:#7aa8ff}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #0a0a0c; color: #e9e9ee; font-family: 'Sarasa Gothic Mono', 'LXGW WenKai', monospace; overflow: hidden">
  <nav aria-label="主导航" style="width: 72px; flex-shrink: 0; background: #101014; border-right: 1px solid rgba(255,255,255,0.09); display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 20px">
    <a href="#" aria-label="Chat" style="width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #9a9aa6"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></a>
    <a href="#" aria-label="River" style="width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #9a9aa6"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 6c3 0 3 2 6 2s3-2 6-2 3 2 6 2M2 12c3 0 3 2 6 2s3-2 6-2 3 2 6 2M2 18c3 0 3 2 6 2s3-2 6-2 3 2 6 2"></path></svg></a>
    <a href="#" aria-label="Library" aria-current="page" style="width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #4f8cff; background: rgba(79,140,255,0.14)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4v16M9 4v16M14 4l5 16"></path></svg></a>
  </nav>
  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <header style="padding: 24px 40px 16px; display: flex; flex-direction: column; gap: 16px; border-bottom: 1px solid rgba(255,255,255,0.09)">
      <div style="display: flex; align-items: center; gap: 16px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600">Library</h1>
        <span style="color: #9a9aa6; font-size: 13px">藏品 · 留下来回味的东西</span>
        <div style="flex: 1"></div>
        <label style="display: flex; align-items: center; gap: 8px; background: #16161c; border: 1px solid rgba(255,255,255,0.16); border-radius: 8px; padding: 0 12px; height: 40px; width: 300px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa6" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input type="search" placeholder="关键词匹配" aria-label="关键词匹配" style="flex: 1; background: transparent; border: 0; color: #e9e9ee; font: inherit; font-size: 14px; outline: none">
        </label>
        <button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #e9e9ee; font: inherit; font-size: 14px; cursor: pointer">选择</button>
      </div>
      <div style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap">
        <div role="tablist" aria-label="类型" style="display: flex; gap: 4px; background: #101014; border-radius: 8px; padding: 4px">
          <button type="button" role="tab" aria-selected="true" style="height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: #4f8cff; color: #fff; font: inherit; font-size: 13px">全部</button>
          <button type="button" role="tab" aria-selected="false" style="height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent; color: #9a9aa6; font: inherit; font-size: 13px">文字</button>
          <button type="button" role="tab" aria-selected="false" style="height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent; color: #9a9aa6; font: inherit; font-size: 13px">图片</button>
          <button type="button" role="tab" aria-selected="false" style="height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent; color: #9a9aa6; font: inherit; font-size: 13px">语音</button>
          <button type="button" role="tab" aria-selected="false" style="height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent; color: #9a9aa6; font: inherit; font-size: 13px">文档</button>
        </div>
        <div style="display: flex; gap: 8px; align-items: center">
          <button type="button" aria-pressed="true" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #4f8cff; background: rgba(79,140,255,0.14); color: #cfe0ff; font: inherit; font-size: 13px">最近 30 天</button>
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #9a9aa6; font: inherit; font-size: 13px">月份 · 2026-10 ▾</button>
          <button type="button" aria-pressed="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #9a9aa6; font: inherit; font-size: 13px">含链接</button>
        </div>
        <div style="display: flex; gap: 6px; align-items: center; color: #9a9aa6; font-size: 13px">
          <span>Tag</span>
          <button type="button" style="height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #9a9aa6; font: inherit; font-size: 12px">#夜里</button>
          <button type="button" style="height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #9a9aa6; font: inherit; font-size: 12px">#猫</button>
          <button type="button" style="height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #9a9aa6; font: inherit; font-size: 12px">#歌</button>
          <button type="button" style="height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #9a9aa6; font: inherit; font-size: 12px">#论文</button>
        </div>
      </div>
      <p style="margin: 0; font-size: 12px; color: #6d6d78">最近 30 天 ∩ 2026-10：两个时间筛选同时生效时取交集</p>
    </header>
    <section aria-label="藏品" style="flex: 1; overflow: hidden; padding: 28px 40px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 28px 24px; align-content: start">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="12">
        <a href="Expanded.dc.html" style="display: flex; flex-direction: column; background: #ece8df; color: #24221e; padding: 10px 10px 0; border-radius: 3px; text-decoration: none; transform: rotate({{c.tilt}}deg); box-shadow: 0 6px 18px rgba(0,0,0,0.45)">
          <div style="aspect-ratio: 1 / 1; background: {{c.bg}}; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative">
            <sc-if value="{{c.isText}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 12px; font-size: 12px; line-height: 1.6; color: #2b2925; align-self: flex-start; white-space: pre-line">{{c.preview}}</p></sc-if>
            <sc-if value="{{c.isImage}}" hint-placeholder-val="{{false}}"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.4" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 17l-5-5-9 8"></path></svg></sc-if>
            <sc-if value="{{c.isAudio}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; align-items: center; gap: 12px"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#3a372f" stroke-width="1.6" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg><span style="width: 40px; height: 40px; border-radius: 20px; background: #24221e; display: flex; align-items: center; justify-content: center" aria-label="播放"><svg width="14" height="14" viewBox="0 0 24 24" fill="#ece8df" aria-hidden="true"><path d="M7 4l14 8-14 8z"></path></svg></span></div></sc-if>
            <sc-if value="{{c.isDoc}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #3a372f"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg><span style="font-size: 11px; letter-spacing: 1px">PDF</span></div></sc-if>
          </div>
          <div style="padding: 10px 2px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 64px">
            <div style="display: flex; align-items: center; gap: 6px"><span style="font-family: 'LXGW WenKai', serif; font-size: 14px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span><sc-if value="{{c.reason}}" hint-placeholder-val="{{false}}"><span title="有收藏理由" aria-label="有收藏理由" style="width: 8px; height: 8px; border-radius: 4px; background: #c2562b"></span></sc-if></div>
            <span style="font-size: 11px; color: #6b665b">{{c.date}}</span>
            <span style="font-size: 11px; color: #6b665b">{{c.tags}}</span>
          </div>
        </a>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const k = (kind) => ({ isText: kind === 'text', isImage: kind === 'image', isAudio: kind === 'audio', isDoc: kind === 'doc' });
    const bgs = { text: '#f7f4ec', image: '#5d6b78', audio: '#d9d3c4', doc: '#d9d3c4' };
    const raw = [
      ['text', '夜里那句话', '10-14 23:12', '#夜里 #阿莱', true, '“你不用急着把它想清楚，\n先放在这里，\n我替你记着。”', -1.2],
      ['image', '窗台上的猫', '10-13 08:40', '#猫', true, '', 0.8],
      ['audio', '哼的那段旋律', '10-12 21:05', '#歌', false, '', -0.6],
      ['doc', '记忆压缩那篇', '10-11 16:20', '#论文', true, '', 1.1],
      ['text', '早安的版本 3', '10-10 07:58', '#阿莱', false, '早安。今天的天气适合\n慢慢醒。', -0.4],
      ['image', '雨后的路灯', '10-09 19:31', '#夜里', false, '', 0.9],
      ['text', '那个链接', '10-08 14:02', '#读', false, 'https://example.org/…\n回头一起看。', 0.5],
      ['audio', '语音 · 晚安', '10-07 00:44', '#夜里', true, '', -1],
      ['image', '未命名', '10-05 12:10', '', false, '', 0.3],
      ['doc', '文档 #41', '10-03 09:15', '#论文', false, '', -0.8],
      ['text', '他说的第一句', '09-30 22:18', '#阿莱', true, '你好呀，我在。', 1],
      ['image', '桌面一角', '09-29 15:47', '#猫 #桌', false, '', -0.5],
    ];
    return { cards: raw.map(([kind, title, date, tags, reason, preview, tilt]) => ({ ...k(kind), bg: bgs[kind], title, date, tags, reason, preview, tilt })) };
  }
}
</script>
</body>
</html>
