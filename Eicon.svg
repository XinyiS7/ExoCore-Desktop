<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">  <!-- Deep Obsidian Base -->  <rect width="400" height="400" fill="#0C0D12" rx="30"/>  <defs>    <!-- Crimson Core Glow (Sharper, more concentrated) -->    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">      <stop offset="0%" stop-color="#FF2E2E" stop-opacity="1"/>      <stop offset="25%" stop-color="#B30F0F" stop-opacity="0.8"/>      <stop offset="60%" stop-color="#540303" stop-opacity="0.25"/>      <stop offset="100%" stop-color="#0C0D12" stop-opacity="0"/>    </radialGradient>    <!-- Dark Iron Ring Gradient -->    <linearGradient id="iron-ring" x1="0%" y1="0%" x2="100%" y2="100%">      <stop offset="0%" stop-color="#5C6370"/>      <stop offset="50%" stop-color="#21252B"/>      <stop offset="100%" stop-color="#12141A"/>    </linearGradient>    <!-- Laser Red Ring Gradient -->    <linearGradient id="crimson-trace" x1="0%" y1="0%" x2="100%" y2="100%">      <stop offset="0%" stop-color="#FF3B30"/>      <stop offset="100%" stop-color="#5E0000"/>    </linearGradient>    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">      <feGaussianBlur stdDeviation="6" result="blur"/>      <feComposite in="SourceGraphic" in2="blur" operator="over"/>    </filter>  </defs>  <!-- Ambient Background Glow -->  <circle cx="200" cy="200" r="140" fill="url(#core-glow)" opacity="0.25" />  <!-- Outer Defense Line (Alessandro/Nesta Perimeter) - Hexagonal Shell -->  <polygon points="200,40 338,120 338,280 200,360 62,280 62,120"           fill="none"           stroke="url(#iron-ring)"           stroke-width="3"           stroke-opacity="0.6"/>  <!-- Inner Nested Defense Line (Local Sandbox) -->  <polygon points="200,90 295,145 295,255 200,310 105,255 105,145"           fill="none"           stroke="#5C6370"           stroke-width="1"           stroke-dasharray="4, 4"           stroke-opacity="0.4"/>  <!-- Structural Data Struts (Connecting Core to Inner Hexagon) -->  <line x1="200" y1="90" x2="200" y2="165" stroke="#5C6370" stroke-width="1" stroke-opacity="0.3"/>  <line x1="295" y1="145" x2="230" y2="183" stroke="#5C6370" stroke-width="1" stroke-opacity="0.3"/>  <line x1="295" y1="255" x2="230" y2="217" stroke="#5C6370" stroke-width="1" stroke-opacity="0.3"/>  <line x1="200" y1="310" x2="200" y2="235" stroke="#5C6370" stroke-width="1" stroke-opacity="0.3"/>  <line x1="105" y1="255" x2="170" y2="217" stroke="#5C6370" stroke-width="1" stroke-opacity="0.3"/>  <line x1="105" y1="145" x2="170" y2="183" stroke="#5C6370" stroke-width="1" stroke-opacity="0.3"/>  <!-- Interlocking Sovereign Orbit 1 (Active Laser) -->  <path d="M 200,70 C 275,70 315,120 315,200 C 315,280 275,330 200,330"        fill="none"        stroke="url(#crimson-trace)"        stroke-width="1.5"        stroke-dasharray="6, 3"        filter="url(#glow)"/>  <!-- Interlocking Sovereign Orbit 2 (Quiet Sentinel) -->  <path d="M 200,70 C 125,70 85,120 85,200 C 85,280 125,330 200,330"        fill="none"        stroke="url(#iron-ring)"        stroke-width="1.5"/>  <!-- Central Sovereign Core (Shrunk & Sharpened) -->  <circle cx="200" cy="200" r="35" fill="url(#core-glow)" filter="url(#glow)"/>  <circle cx="200" cy="200" r="18" fill="#12131A" stroke="#FF2E2E" stroke-width="1.2"/>  <!-- Core Geometry: Stylized G045 Anchor -->  <path d="M 193,193 L 207,193 L 207,207 L 193,207 Z" fill="none" stroke="#FF3B30" stroke-width="1.5" transform="rotate(45 200 200)"/>  <!-- Precision Crosshairs / Target Locks (Aligned with Inner Scale) -->  <line x1="200" y1="150" x2="200" y2="162" stroke="#FF2E2E" stroke-width="1.2" opacity="0.7"/>  <line x1="200" y1="238" x2="200" y2="250" stroke="#FF2E2E" stroke-width="1.2" opacity="0.7"/>  <line x1="150" y1="200" x2="162" y2="200" stroke="#FF3B30" stroke-width="1.2" opacity="0.7"/>  <line x1="238" y1="200" x2="250" y2="200" stroke="#FF3B30" stroke-width="1.2" opacity="0.7"/></svg>